[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ea"
version = "0.1.0"
description = "Personal Executive Assistant — Financial Tracker"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
]

[project.scripts]
ea = "ea.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ea*"]
